<!doctype html>
<html>
  <head>
    <title>Dashboard Layout</title>

    <!-- Grid for layout -->
    <link rel="stylesheet" href="../styles/grid.css" />
    <link rel="stylesheet" href="../styles/task18.css" />

    <!-- Flexbox for cards -->
    <link rel="stylesheet" href="../styles/flexbox.css" />
  </head>
  <body>
    <div class="dashboard">
      <!-- Sidebar -->
      <div class="dash-sidebar">
        <h2>Admin</h2>
        <p>Dashboard</p>
        <p>Users</p>
        <p>Settings</p>
      </div>

      <!-- Main Content -->
      <div class="dash-main">
        <h1>Dashboard</h1>

        <!-- Cards -->
        <div class="cards">
          <div class="card">Users: 100</div>
          <div class="card">Sales: 250</div>
          <div class="card">Revenue: $500</div>
        </div>
      </div>
    </div>
  </body>
</html>
